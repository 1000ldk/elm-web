<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- ローカル開発は "/"。GitHub Pages へのデプロイ時は
         .github/workflows/deploy.yml が "/<リポジトリ名>/" に書き換える。 -->
    <base href="/">
    <title>1000LDK Blog</title>
</head>
<body>
    <div id="app"></div>
    <script src="main.js"></script>
    <script>
        // <base> で決まるパス(ローカルなら "/"、Pages なら "/elm-web/")を
        // フラグとして Elm に渡し、ルーティングの前置きパスとして使う。
        Elm.Main.init({
            node: document.getElementById("app"),
            flags: new URL(document.baseURI).pathname
        });
    </script>
</body>
</html>
